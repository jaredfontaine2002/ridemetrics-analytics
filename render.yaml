services:
  - type: web
    name: ridemetrics
    env: python
    plan: free
    buildCommand: pip install 'streamlit>=1.30' 'pandas>=2.0' 'plotly>=5.18'
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
